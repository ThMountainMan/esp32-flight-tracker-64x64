[common]
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

lib_deps =
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@^3.0.15
    adafruit/Adafruit GFX Library@^1.12.0
    ArduinoJson@^7.0.0
    AsyncTCP@^1.1.1
    ESP Async WebServer@^1.2.3

build_flags =
    -DMATRIX_WIDTH=64
    -DMATRIX_HEIGHT=64
    -Wall

board_build.filesystem = littlefs

; ---- Development builds: verbose serial logging enabled ----
[env:esp32-dev]
extends = common
platform = espressif32
board = esp32dev
build_flags =
    ${common.build_flags}
    -DCORE_DEBUG_LEVEL=2

[env:esp32-s3]
extends = common
platform = espressif32
board = esp32-s3-devkitc-1
build_flags =
    ${common.build_flags}
    -DCORE_DEBUG_LEVEL=2

; ---- Release builds: debug logging disabled to save CPU and flash ----
[env:esp32-dev-release]
extends = common
platform = espressif32
board = esp32dev
build_flags =
    ${common.build_flags}
    -DCORE_DEBUG_LEVEL=0

[env:esp32-s3-release]
extends = common
platform = espressif32
board = esp32-s3-devkitc-1
build_flags =
    ${common.build_flags}
    -DCORE_DEBUG_LEVEL=0
