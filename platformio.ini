[common]
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

lib_deps =
    mrcodetastic/ESP32-HUB75-MatrixPanel-DMA@^3.0.0
    ArduinoJson@^7.0.0
    AsyncTCP@^1.1.1
    ESP Async WebServer@^1.2.3

build_flags =
    -DCORE_DEBUG_LEVEL=2
    -DMATRIX_WIDTH=64
    -DMATRIX_HEIGHT=64
    -Wall

board_build.filesystem = littlefs

[env:esp32-dev]
extends = common
platform = espressif32
board = esp32dev

[env:esp32-s3]
extends = common
platform = espressif32
board = esp32-s3-devkitc-1
