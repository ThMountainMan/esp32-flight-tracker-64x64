[env:esp32-dev]
platform = espressif32
board = esp32devkit
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    ESP32-HUB75-MatrixPanel-I2S-DMA@^4.0.1
    ArduinoJson@^7.0.0
    AsyncTCP@^1.1.1
    ESP Async WebServer@^1.2.3

build_flags =
    -DCONFIG_SPIRAM_STACK_EXTERNAL_ALLOC=1
    -DCORE_DEBUG_LEVEL=2
    -DMATRIX_WIDTH=64
    -DMATRIX_HEIGHT=64
    -Wall

upload_speed = 921600

